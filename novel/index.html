<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Преступление на перемене</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Фоновый плеер музыки без хардкода трека -->
    <audio id="bgm" loop></audio>

    <div id="game-container">
        <!-- Всплывающее уведомление о сохранении -->
        <div id="toast" class="toast">Сохранено!</div>

        <!-- Главное меню -->
        <div id="main-menu">
            <div class="menu-box">
                <h1 class="game-title">Инцидент с ответами</h1>
                <p class="game-subtitle">Школьное расследование</p>
                <div class="menu-buttons">
                    <button id="btn-new-game" class="menu-btn">Новая игра</button>
                    <button id="btn-continue" class="menu-btn">Продолжить</button>
                    <button id="btn-menu-settings" class="menu-btn">Настройки</button>
                    <button id="btn-credits" class="menu-btn">Об авторах</button>
                </div>
            </div>
        </div>

        <!-- Модальное окно настроек -->
        <div id="settings-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2>Настройки</h2>
                <div class="setting-item">
                    <label>Громкость музыки и звуков:</label>
                    <div class="slider-wrapper">
                        <button id="mute-toggle-btn">🔊</button>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.3">
                    </div>
                </div>
                <div class="setting-item">
                    <label>Скорость печати текста:</label>
                    <input type="range" id="speed-slider" min="5" max="50" step="5" value="25">
                </div>
                <div class="modal-buttons">
                    <button id="btn-to-main-menu" class="sub-btn" style="display: none;">В главное меню</button>
                    <button id="btn-close-settings" class="sub-btn">Закрыть</button>
                </div>
            </div>
        </div>

        <!-- Окно об авторах -->
        <div id="credits-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2>Об игре</h2>
                <p>Короткая интерактивная детективная новелла.</p>
                <p>Сделано на чистом JavaScript и HTML5 Canvas/DOM.</p>
                <div class="modal-buttons">
                    <button id="btn-close-credits" class="sub-btn">Назад</button>
                </div>
            </div>
        </div>

        <!-- Игровые слои -->
        <img id="bg-layer" src="" alt="Background" style="display: none;">
        <img id="character-sprite" src="" alt="Character" style="display: none;">

        <div id="ui-layer" style="display: none;">
            <!-- Кнопки выбора ответов -->
            <div id="choices-container"></div>
            
            <div id="dialogue-wrapper">
                <div id="name-box">
                    <span id="speaker-name"></span>
                </div>
                
                <div id="dialogue-box">
                    <!-- Функциональные иконки слева -->
                    <div class="side-icons left-icons">
                        <img id="btn-save" src="assets/ui/icon_save.png" alt="Сохранить" title="Быстрое сохранение" class="ui-icon">
                        <img id="btn-load" src="assets/ui/icon_load.png" alt="Загрузить" title="Быстрая загрузка" class="ui-icon">
                        <img id="btn-game-settings" src="assets/ui/icon_settings.png" alt="Настройки" title="Настройки" class="ui-icon">
                    </div>
                    
                    <p id="dialogue-text"></p>
                    
                    <!-- Функциональные иконки справа -->
                    <div class="side-icons right-icons">
                        <img id="btn-skip" src="assets/ui/icon_skip.png" alt="Скип" title="Завершить текст" class="ui-icon">
                        <img id="btn-next" src="assets/ui/icon_next.png" alt="Далее" title="Далее" class="ui-icon">
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
